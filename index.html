<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giáo trình Quê Việt • Học Tiếng Việt Cơ Bản</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    .book-card {
      transition: all 0.2s ease;
    }
    .book-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 24px -8px rgb(16 185 129 / 0.28);
    }
    .book-card.has-lessons:hover {
      border-color: #059669;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-20">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-emerald-700 flex items-center justify-center text-white shadow-sm">
          <i class="fa-solid fa-book-open text-lg"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg text-slate-900 tracking-tight">Quê Việt</h1>
          <p class="text-xs text-slate-500">Học Tiếng Việt Cơ Bản</p>
        </div>
      </div>
      <a href="lesson.html" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white text-sm font-semibold transition">
        <i class="fa-solid fa-chalkboard-user"></i>
        <span class="hidden sm:inline">Vào lớp học</span>
      </a>
    </div>
  </header>

  <!-- Main -->
  <main class="flex-1 max-w-5xl mx-auto w-full px-4 sm:px-6 py-10 sm:py-12">
    <div class="mb-8 sm:mb-10">
      <h2 class="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight">
        Giáo trình Quê Việt
      </h2>
      <p class="mt-2 text-slate-500 text-sm sm:text-base">
        Chọn quyển để vào học. Các bài học được nạp tự động từ thư mục
        <code class="px-1.5 py-0.5 rounded bg-slate-100 text-emerald-700 text-xs font-mono">data/</code>.
      </p>
    </div>

    <!-- Book grid – render từ books-index.js -->
    <div id="book-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-5">
      <div class="col-span-full text-center py-12 text-slate-400 text-sm">
        <i class="fa-solid fa-spinner fa-spin text-2xl mb-3 block"></i>
        Đang tải danh sách quyển...
      </div>
    </div>

    <p class="mt-10 text-center text-xs text-slate-400">
      Nhấn vào quyển có bài để bắt đầu học · Giao diện tiếng Việt &amp; 中文
    </p>
  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-200 bg-white">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-5 flex flex-col sm:flex-row items-center justify-between gap-2 text-xs text-slate-500">
      <span>© Giáo trình Quê Việt · Học tiếng Việt cơ bản</span>
      <span class="flex items-center gap-1.5">
        <i class="fa-solid fa-globe text-emerald-600"></i>
        Tiếng Việt • 中文
      </span>
    </div>
  </footer>

  <script src="data/books-index.js"></script>
  <script>
    (function () {
      const BOOKS = window.BOOKS_INDEX || {};
      const ORDER = ["A1", "A2", "B1", "B2", "C1", "C2"];
      const grid = document.getElementById("book-grid");
      if (!grid) return;

      function countReady(lessons) {
        if (!Array.isArray(lessons)) return 0;
        return lessons.filter(function (l) { return l.ready; }).length;
      }

      function progressPct(ready, total) {
        if (!total) return 0;
        return Math.round((ready / total) * 100);
      }

      const cards = ORDER.map(function (code) {
        const book = BOOKS[code] || { nameVi: "Quyển " + code, lessons: [] };
        const lessons = book.lessons || [];
        const total = lessons.length;
        const ready = countReady(lessons);
        const hasLessons = ready > 0;
        const pct = progressPct(ready, total || 1);

        const badge = hasLessons
          ? '<span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-100">' + ready + ' bài đã nạp</span>'
          : '<span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-100 text-slate-500 border border-slate-200">Chưa có bài</span>';

        const barColor = hasLessons ? "bg-emerald-500" : "bg-slate-300";
        const barWidth = hasLessons ? Math.max(pct, 8) : 0;

        const levelLabel =
          code.indexOf("A") === 0 ? "Cơ bản" :
          code.indexOf("B") === 0 ? "Trung cấp" : "Cao cấp";

        return (
          '<a href="lesson.html?book=' + code + '" class="book-card ' + (hasLessons ? "has-lessons" : "") + ' group block bg-white rounded-2xl border border-slate-200 p-5 ' + (hasLessons ? "hover:border-emerald-300" : "opacity-90") + '">' +
            '<div class="flex items-start justify-between mb-3">' +
              '<span class="text-3xl font-extrabold text-emerald-700 leading-none">' + code + '</span>' +
              badge +
            '</div>' +
            '<h3 class="font-bold text-slate-800 text-base mb-0.5">Quyển ' + code + '</h3>' +
            '<p class="text-xs text-slate-500 mb-4">Trình độ ' + code.charAt(0) + ' · ' + levelLabel + '</p>' +
            '<div class="h-1.5 w-full bg-slate-100 rounded-full overflow-hidden">' +
              '<div class="h-full ' + barColor + ' rounded-full transition-all" style="width: ' + barWidth + '%"></div>' +
            '</div>' +
          '</a>'
        );
      }).join("");

      grid.innerHTML = cards;
    })();
  </script>
</body>
</html>
